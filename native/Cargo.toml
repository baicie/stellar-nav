[workspace]
members = [
  "astro_engine",
  "crates/astro_core",
  "crates/ephemeris_engine",
  "crates/route_engine",
  "crates/search_core",
  "crates/spatial_index",
  "crates/tile_decoder",
  "crates/time_engine",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
