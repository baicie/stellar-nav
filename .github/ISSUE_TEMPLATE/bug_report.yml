name: Bug 报告
description: 报告可复现的问题
title: 'bug: '
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 请给出最小、可重复的步骤。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: iOS/Android/Web、设备、版本
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 日志或截图
      description: 请移除密钥、个人数据和敏感信息。
