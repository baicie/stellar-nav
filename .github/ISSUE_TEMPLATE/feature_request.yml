name: 功能建议
description: 提议一个符合产品范围的新能力
title: 'feat: '
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明用户场景，而不是只描述实现方式。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: 边界确认
      options:
        - label: 我确认这不会把模拟或虚构值伪装成观测事实。
          required: true
        - label: 我确认这不会默认引入账号、遥测或在线 API。
          required: true
