name: Android Release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  FRB_VERSION: 2.12.0
  FRB_WASM_TOOLCHAIN: nightly-2026-08-01
  RUST_TOOLCHAIN: 1.96.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  verify:
    name: Verify Android release source
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      version: ${{ steps.release.outputs.version }}
      version_code: ${{ steps.release.outputs.version_code }}
      tag: ${{ steps.release.outputs.tag }}
      certificate_sha256: ${{ steps.release.outputs.certificate_sha256 }}
      is_prerelease: ${{ steps.release.outputs.is_prerelease }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate annotated tag and release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ "$(git cat-file -t "refs/tags/${tag}")" != "tag" ]]; then
            echo "Android releases require an annotated tag: ${tag}" >&2
            exit 1
          fi
          tag_commit="$(git rev-parse "refs/tags/${tag}^{commit}")"
          if [[ "${tag_commit}" != "${GITHUB_SHA}" ]]; then
            echo "Tag commit does not match the workflow source." >&2
            exit 1
          fi
          git fetch --force --no-tags origin \
            "+refs/heads/main:refs/remotes/origin/main"
          git merge-base --is-ancestor "${tag_commit}" origin/main

          version="$(
            python3 -m tools.release.check_release \
              --version "${tag}" \
              --field version
          )"
          version_code="$(
            python3 -m tools.release.check_release \
              --version "${tag}" \
              --field version_code
          )"
          certificate="$(
            python3 -m tools.release.check_release \
              --version "${tag}" \
              --field certificate_sha256
          )"
          is_prerelease="$(
            python3 -m tools.release.check_release \
              --version "${tag}" \
              --field is_prerelease
          )"
          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "tag=${tag}"
            echo "certificate_sha256=${certificate}"
            echo "is_prerelease=${is_prerelease}"
          } >> "${GITHUB_OUTPUT}"

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native

      - name: Install pinned FRB web toolchain
        shell: bash
        run: >-
          rustup toolchain install "${FRB_WASM_TOOLCHAIN}"
          --profile minimal
          --component rust-src
          --target wasm32-unknown-unknown

      - name: Install bridge build tools
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: >-
            flutter_rust_bridge_codegen@${{ env.FRB_VERSION }},
            wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run quality gates
        run: ./scripts/verify.sh

  android:
    name: Build signed split Android packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      attestations: write
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust Android builds
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native
          shared-key: android-release

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Build and verify signed split APKs
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_EXPECTED_CERTIFICATE_SHA256: ${{ needs.verify.outputs.certificate_sha256 }}
        run: |
          set -euo pipefail
          for secret_name in \
            ANDROID_KEYSTORE_BASE64 \
            ANDROID_KEYSTORE_PASSWORD \
            ANDROID_KEY_ALIAS \
            ANDROID_KEY_PASSWORD; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Missing Android release secret: ${secret_name}" >&2
              exit 1
            fi
          done
          keystore="${RUNNER_TEMP}/astro-nav-release.jks"
          trap 'rm -f "${keystore}"' EXIT
          printf '%s' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore}"
          chmod 600 "${keystore}"
          export ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_STORE_FILE="${keystore}"
          export ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_STORE_PASSWORD="${ANDROID_KEYSTORE_PASSWORD}"
          export ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_KEY_ALIAS="${ANDROID_KEY_ALIAS}"
          export ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_KEY_PASSWORD="${ANDROID_KEY_PASSWORD}"
          ./scripts/package_android_release.sh "${{ needs.verify.outputs.version }}"

      - name: Attest Android APKs
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: release/android/*.apk

      - name: Upload verified Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astro-nav-android-v${{ needs.verify.outputs.version }}
          path: release/android/
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  publish:
    name: Publish GitHub prerelease
    needs: [verify, android]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout release notes
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download verified Android packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: astro-nav-android-v${{ needs.verify.outputs.version }}
          path: release-artifacts

      - name: Verify downloaded release contract
        shell: bash
        working-directory: release-artifacts
        run: |
          set -euo pipefail
          for asset in \
            astro-nav-android-arm64-v8a.apk \
            astro-nav-android-armeabi-v7a.apk \
            astro-nav-android-x86_64.apk \
            SHA256SUMS.txt \
            release-metadata.json; do
            test -s "${asset}"
          done
          test "$(find . -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          test "$(find . -maxdepth 1 -type f -name '*.apk' | wc -l | tr -d ' ')" -eq 3
          sha256sum --check SHA256SUMS.txt

      - name: Create or verify immutable GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
          IS_PRERELEASE: ${{ needs.verify.outputs.is_prerelease }}
        run: |
          set -euo pipefail
          notes_file="docs/releases/${RELEASE_VERSION}.md"
          test -s "${notes_file}"
          # The immutable-releases setting is an Administration endpoint that the
          # workflow GITHUB_TOKEN cannot read. The published release state below
          # is the authoritative check and fails closed when immutability is off.

          verify_remote_release_tag() {
            local remote_ref="refs/release-verification/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            if ! git fetch --force --no-tags origin \
              "+refs/tags/${RELEASE_TAG}:${remote_ref}"; then
              echo "Unable to fetch the release tag from origin." >&2
              exit 1
            fi
            if [[ "$(git cat-file -t "${remote_ref}")" != "tag" ]]; then
              echo "Release tag is not annotated." >&2
              git update-ref -d "${remote_ref}"
              exit 1
            fi
            remote_commit="$(git rev-parse "${remote_ref}^{commit}")"
            git update-ref -d "${remote_ref}"
            if [[ "${remote_commit}" != "${GITHUB_SHA}" ]]; then
              echo "Remote release tag no longer points at the workflow commit." >&2
              exit 1
            fi
          }
          verify_remote_release_tag

          expected_assets="$(
            printf '%s\n' \
              SHA256SUMS.txt \
              astro-nav-android-arm64-v8a.apk \
              astro-nav-android-armeabi-v7a.apk \
              astro-nav-android-x86_64.apk \
              release-metadata.json |
              sort
          )"
          expected_title="天枢导航 ${RELEASE_TAG} · Android 内测版"
          expected_body="$(cat "${notes_file}")"
          release_flags=(--prerelease="${IS_PRERELEASE}")
          release_json_file="$(mktemp "${RUNNER_TEMP}/release.XXXXXX.json")"
          release_error_file="$(mktemp "${RUNNER_TEMP}/release.XXXXXX.error")"
          release_exists=false

          if gh release view "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --json assets,body,isDraft,isImmutable,isPrerelease,name,url \
            > "${release_json_file}" 2> "${release_error_file}"; then
            release_exists=true
          elif grep -Fqx 'release not found' "${release_error_file}"; then
            release_exists=false
          else
            cat "${release_error_file}" >&2
            echo "Unable to determine whether the release exists." >&2
            exit 1
          fi

          if [[ "${release_exists}" == "true" ]]; then
            existing_is_draft="$(jq -r '.isDraft' "${release_json_file}")"
            existing_is_immutable="$(jq -r '.isImmutable' "${release_json_file}")"
            existing_is_prerelease="$(jq -r '.isPrerelease' "${release_json_file}")"
            actual_assets="$(
              jq -r '.assets[].name' "${release_json_file}" |
                sort
            )"

            if [[ "${existing_is_draft}" == "true" && \
                  "${existing_is_immutable}" != "false" ]]; then
              echo "Existing draft reports an impossible immutable state." >&2
              exit 1
            fi
            if [[ "${existing_is_draft}" == "false" && \
                  ( "${existing_is_immutable}" != "true" || \
                    "${existing_is_prerelease}" != "${IS_PRERELEASE}" ) ]]; then
              echo "Existing published release state is inconsistent." >&2
              exit 1
            fi
          else
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "${expected_title}" \
              --notes-file "${notes_file}" \
              "${release_flags[@]}"
            existing_is_draft=true
            existing_is_immutable=false
            actual_assets=""
          fi

          existing_assets_dir="$(mktemp -d "${RUNNER_TEMP}/existing-assets.XXXXXX")"
          if [[ -n "${actual_assets}" ]]; then
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern '*' \
              --dir "${existing_assets_dir}"
          fi
          while IFS= read -r existing_asset; do
            [[ -n "${existing_asset}" ]] || continue
            if [[ ! -f "release-artifacts/${existing_asset}" ]]; then
              echo "Existing release contains an unexpected asset: ${existing_asset}" >&2
              exit 1
            fi
            if ! cmp --silent \
              "release-artifacts/${existing_asset}" \
              "${existing_assets_dir}/${existing_asset}"; then
              echo "Existing release asset differs: ${existing_asset}" >&2
              exit 1
            fi
          done <<< "${actual_assets}"

          if [[ "${existing_is_draft}" == "true" ]]; then
            while IFS= read -r expected_asset; do
              if ! grep -Fqx "${expected_asset}" <<< "${actual_assets}"; then
                gh release upload "${RELEASE_TAG}" \
                  "release-artifacts/${expected_asset}" \
                  --repo "${GITHUB_REPOSITORY}"
              fi
            done <<< "${expected_assets}"

            draft_assets="$(
              gh release view "${RELEASE_TAG}" \
                --repo "${GITHUB_REPOSITORY}" \
                --json assets \
                --jq '.assets[].name' |
                sort
            )"
            if [[ "${draft_assets}" != "${expected_assets}" ]]; then
              echo "Draft release assets are incomplete or unexpected." >&2
              exit 1
            fi
            draft_assets_dir="$(mktemp -d "${RUNNER_TEMP}/draft-assets.XXXXXX")"
            gh release download "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --pattern '*' \
              --dir "${draft_assets_dir}"
            while IFS= read -r expected_asset; do
              if ! cmp --silent \
                "release-artifacts/${expected_asset}" \
                "${draft_assets_dir}/${expected_asset}"; then
                echo "Uploaded draft asset differs: ${expected_asset}" >&2
                exit 1
              fi
            done <<< "${expected_assets}"

            verify_remote_release_tag
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${expected_title}" \
              --notes-file "${notes_file}" \
              --draft=false \
              "${release_flags[@]}"
          elif [[ "${actual_assets}" != "${expected_assets}" ]]; then
            echo "Existing immutable release assets are incomplete or unexpected." >&2
            exit 1
          fi

          verify_remote_release_tag

          final_release_json="$(
            gh release view "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --json assets,body,isDraft,isImmutable,isPrerelease,name,url
          )"
          published_is_draft="$(jq -r '.isDraft' <<< "${final_release_json}")"
          published_is_immutable="$(jq -r '.isImmutable' <<< "${final_release_json}")"
          published_is_prerelease="$(jq -r '.isPrerelease' <<< "${final_release_json}")"
          published_title="$(jq -r '.name' <<< "${final_release_json}")"
          published_body="$(jq -r '.body' <<< "${final_release_json}")"
          published_assets="$(
            jq -r '.assets[].name' <<< "${final_release_json}" |
              sort
          )"
          if [[ "${published_is_draft}" != "false" || \
                "${published_is_immutable}" != "true" || \
                "${published_is_prerelease}" != "${IS_PRERELEASE}" || \
                "${published_title}" != "${expected_title}" || \
                "${published_body}" != "${expected_body}" || \
                "${published_assets}" != "${expected_assets}" ]]; then
            echo "Published GitHub release state is invalid." >&2
            exit 1
          fi
          printf '%s\n' "${final_release_json}"
