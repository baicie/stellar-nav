name: Web Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: web-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  FRB_VERSION: 2.12.0
  FRB_WASM_TOOLCHAIN: nightly-2026-08-01
  RUST_TOOLCHAIN: 1.96.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  package-web:
    name: Verify and package web app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf 'Release tags must use vMAJOR.MINOR.PATCH, got %s\n' "$tag" >&2
            exit 1
          fi
          package_version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml | head -n 1)"
          if [[ "$tag" != "v$package_version" ]]; then
            printf 'Tag %s does not match pubspec version %s\n' "$tag" "$package_version" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "refs/tags/$tag")" != "tag" ]]; then
            printf 'Release tag %s must be annotated\n' "$tag" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: native

      - name: Install pinned FRB web toolchain
        shell: bash
        run: >-
          rustup toolchain install "${FRB_WASM_TOOLCHAIN}"
          --profile minimal
          --component rust-src
          --target wasm32-unknown-unknown

      - name: Install bridge build tools
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: >-
            flutter_rust_bridge_codegen@${{ env.FRB_VERSION }},
            wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run quality gates
        run: ./scripts/verify.sh

      - name: Upload web release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: astro-nav-web-${{ github.run_id }}
          path: build/web/
          if-no-files-found: error
          retention-days: 30
