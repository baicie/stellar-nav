name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  FRB_VERSION: 2.12.0
  FRB_WASM_TOOLCHAIN: nightly-2026-08-01
  RUST_TOOLCHAIN: 1.96.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  verify:
    name: Verify Flutter and Rust app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native

      - name: Install pinned FRB web toolchain
        shell: bash
        run: >-
          rustup toolchain install "${FRB_WASM_TOOLCHAIN}"
          --profile minimal
          --component rust-src
          --target wasm32-unknown-unknown

      - name: Install bridge build tools
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: >-
            flutter_rust_bridge_codegen@${{ env.FRB_VERSION }},
            wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run quality gates
        run: ./scripts/verify.sh

  android-release-smoke:
    name: Build Android release smoke packages
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust Android targets
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust Android builds
        uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: native
          shared-key: android-release-smoke

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -nE 's/^version:[[:space:]]*([^+[:space:]]+).*/\1/p' pubspec.yaml)"
          python3 -m tools.release.check_release --version "${version}"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"

      - name: Create isolated CI signing key
        shell: bash
        run: |
          set -euo pipefail
          keystore="${RUNNER_TEMP}/astro-nav-ci-release.jks"
          password="astro-nav-ci-only-password"
          alias="astro-nav-ci"
          keytool -genkeypair \
            -keystore "${keystore}" \
            -storepass "${password}" \
            -keypass "${password}" \
            -alias "${alias}" \
            -dname "CN=AstroNav CI,OU=CI,O=AstroNav,L=CI,ST=CI,C=CN" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2
          certificate="$(
            keytool -exportcert -rfc \
              -keystore "${keystore}" \
              -storepass "${password}" \
              -alias "${alias}" |
              python3 -m tools.release.extract_certificate_sha256
          )"
          {
            echo "ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_STORE_FILE=${keystore}"
            echo "ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_STORE_PASSWORD=${password}"
            echo "ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_KEY_ALIAS=${alias}"
            echo "ORG_GRADLE_PROJECT_ASTRONAV_UPLOAD_KEY_PASSWORD=${password}"
            echo "ANDROID_EXPECTED_CERTIFICATE_SHA256=${certificate}"
            echo "ANDROID_ALLOW_TEST_CERTIFICATE=1"
          } >> "${GITHUB_ENV}"

      - name: Build and verify split Android packages
        run: ./scripts/package_android_release.sh "${{ steps.release.outputs.version }}"

      - name: Upload Android smoke packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astro-nav-android-smoke-${{ github.run_id }}
          path: release/android/
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Remove CI signing key
        if: always()
        shell: bash
        run: rm -f "${RUNNER_TEMP}/astro-nav-ci-release.jks"
