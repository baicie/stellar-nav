name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.44.8
  FRB_VERSION: 2.12.0
  FRB_WASM_TOOLCHAIN: nightly-2026-08-01
  RUST_TOOLCHAIN: 1.96.0
  WASM_PACK_VERSION: 0.15.0

jobs:
  verify:
    name: Verify Flutter and Rust app
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy,rustfmt

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: native

      - name: Install pinned FRB web toolchain
        shell: bash
        run: >-
          rustup toolchain install "${FRB_WASM_TOOLCHAIN}"
          --profile minimal
          --component rust-src
          --target wasm32-unknown-unknown

      - name: Install bridge build tools
        uses: taiki-e/install-action@cb33e69fad06166ca28a42b2575e4dadabf62ee8 # v2.85.8
        with:
          tool: >-
            flutter_rust_bridge_codegen@${{ env.FRB_VERSION }},
            wasm-pack@${{ env.WASM_PACK_VERSION }}

      - name: Resolve Flutter dependencies
        run: flutter pub get --enforce-lockfile

      - name: Run quality gates
        run: ./scripts/verify.sh
